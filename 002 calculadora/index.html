<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculadora</title>
  </head>
  <body>
    <div class="calculator">
      <div class="display" id="display">0</div>

      <div class="buttons">
        <button class="clear" id="clearDisplay">CE</button>
        <button class="clear" id="clearCalc">C</button>
        <button id="backspace">⌫</button>
        <button class="operator" id="operatorDivision">/</button>

        <button id="key7">7</button>
        <button id="key8">8</button>
        <button id="key9">9</button>
        <button class="operator" id="operatorMultiplication">×</button>

        <button id="key4">4</button>
        <button id="key5">5</button>
        <button id="key6">6</button>
        <button class="operator" id="operatorSubtraction">−</button>

        <button id="key1">1</button>
        <button id="key2">2</button>
        <button id="key3">3</button>
        <button class="operator" id="operatorAddition">+</button>

        <button id="keyPlusMinus">±</button>
        <button id="key0">0</button>
        <button id="keyComma">,</button>
        <button class="equal" id="equalButton">=</button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
